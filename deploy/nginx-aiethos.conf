# nginx site config for aiethos.ru — reverse proxy to the Next.js server (127.0.0.1:3000)
#
# Install:
#   cp deploy/nginx-aiethos.conf /etc/nginx/sites-available/aiethos.ru
#   ln -sf /etc/nginx/sites-available/aiethos.ru /etc/nginx/sites-enabled/aiethos.ru
#   nginx -t && systemctl reload nginx
#
# The `ssl_certificate` lines below assume certbot has already issued a cert:
#   certbot --nginx -d aiethos.ru -d www.aiethos.ru
# On a first run (no cert yet) comment out both HTTPS blocks, install, then
# issue the certificate and uncomment.
#
# Other projects share this host (domostroy/aicards on 8080 and 8443).
# Everything here is scoped by server_name and port, so those blocks are
# untouched.

# --- HTTP: everything goes to HTTPS on the canonical host ---------------------
# Previously http://www.aiethos.ru returned 404 while http://aiethos.ru
# redirected — inconsistent host handling that split crawl signals.
server {
    listen 80;
    listen [::]:80;
    server_name aiethos.ru www.aiethos.ru;

    # Let certbot serve the ACME challenge over plain HTTP.
    # A location block wins over the server-level `return`, so renewals keep working.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://aiethos.ru$request_uri;
}

# --- HTTPS www -> non-www ----------------------------------------------------
# www used to answer 200 with a full copy of the site. The canonical tag papered
# over the duplicate; a 301 removes it outright.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aiethos.ru;

    ssl_certificate /etc/letsencrypt/live/aiethos.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aiethos.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://aiethos.ru$request_uri;
}

# --- HTTPS: the site ---------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    # ALPN used to negotiate http/1.1 only: every asset queued behind the
    # per-host connection limit instead of being multiplexed.
    http2 on;
    server_name aiethos.ru;

    ssl_certificate /etc/letsencrypt/live/aiethos.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aiethos.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Security headers — none were set at all before.
    # Mind nginx's add_header inheritance: a location that declares its own
    # add_header drops every header inherited from here. That is exactly why
    # /_next/static/ below sets none of its own.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Next.js already sends `Cache-Control: public, max-age=31536000, immutable`
    # for build assets. nginx used to add the very same header a second time, so
    # the response carried it twice. Just proxy and let Next.js own it.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
