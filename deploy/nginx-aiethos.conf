# nginx site config for aiethos.ru — reverse proxy to the Next.js server (127.0.0.1:3000)
#
# Install:
#   cp deploy/nginx-aiethos.conf /etc/nginx/sites-available/aiethos.ru
#   ln -sf /etc/nginx/sites-available/aiethos.ru /etc/nginx/sites-enabled/aiethos.ru
#   nginx -t && systemctl reload nginx
#
# HTTPS (the `listen 443 ssl` block + redirect) is added automatically by:
#   certbot --nginx -d aiethos.ru -d www.aiethos.ru
# Run certbot only after the A record for aiethos.ru points to this server.

server {
    listen 80;
    listen [::]:80;
    server_name aiethos.ru www.aiethos.ru;

    # Let certbot serve the ACME challenge over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Cache Next.js immutable build assets aggressively.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
